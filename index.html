<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff1e6">
  <title>TISC 2026 | Onsite Registration</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#fff1e6;font-family:Arial,Helvetica,sans-serif;color:#202124}
    header{width:min(100% - 24px,800px);min-height:56px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
    header strong{font-size:14px;font-weight:700;color:#5f6368}header a{display:inline-flex;min-height:40px;align-items:center;padding:0 14px;border:1px solid #b84712;border-radius:5px;color:#b84712;font-size:13px;font-weight:700;text-decoration:none;white-space:nowrap}header a:focus-visible{outline:3px solid #b84712;outline-offset:3px}header a:hover{background:#fff}
    iframe{display:block;width:100%;height:calc(100dvh - 56px);min-height:620px;border:0;background:#fff1e6}
    .setup{max-width:800px;margin:20px auto;padding:30px;background:#fff;border:1px solid #dadce0;border-top:12px solid #f5a15b;border-radius:9px}.setup h1{margin:0 0 10px;font-weight:500}.setup p{line-height:1.6}.setup strong{display:block;margin-top:24px}
    @media(max-width:480px){header{width:min(100% - 20px,800px)}header strong{font-size:12px;max-width:215px}header a{font-size:12px;padding:0 10px}.setup{margin:12px 10px;padding:22px 18px}}
  </style>
</head>
<body>
  <header><strong>TISC 2026 · ONSITE REGISTRATION</strong><a id="staffLink" href="#staff" aria-label="Staff dashboard">STAFF</a></header>
  <main id="mount" aria-live="polite"></main>
  <script src="config.js"></script>
  <script>
    (function(){
      var url = window.TISC_APP_URL;
      var mount = document.getElementById('mount');
      if (!url || !/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(url)) {
        mount.innerHTML = '<section class="setup"><h1>Onsite Registration</h1><p>Registration is not available yet. Please contact registration staff.</p><strong>4 October 2026 · Floor 6</strong></section>';
        return;
      }
      var frame = document.createElement('iframe');
      frame.title = 'TISC 2026 registration';
      function route(){
        var staff = location.hash === '#staff';
        frame.src = url + (staff ? '?view=staff' : '');
        document.getElementById('staffLink').href = staff ? '#' : '#staff';
        document.getElementById('staffLink').textContent = staff ? 'CHECK IN' : 'STAFF';
      }
      route();
      frame.referrerPolicy = 'no-referrer';
      mount.appendChild(frame);
      addEventListener('hashchange', route);
    })();
  </script>
</body>
</html>
