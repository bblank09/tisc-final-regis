<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f7fb">
  <title>TISC 2026 | Onsite Registration</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f3f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#142c49}
    header{width:min(calc(100% - 24px),800px);min-height:56px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
    header strong{font-size:16px;font-weight:700}header .subtitle{margin-left:12px;color:#536b85;font-size:14px}header a{display:inline-flex;min-height:42px;align-items:center;padding:0 17px;border:1px solid #d9e4f0;border-radius:8px;background:#fff;color:#1d4f85;font-size:13px;font-weight:700;text-decoration:none;white-space:nowrap}header a:focus-visible{outline:3px solid #3975b8;outline-offset:3px}header a:hover{background:#eaf3fc}
    iframe{display:block;width:100%;height:calc(100dvh - 56px);min-height:620px;border:0;background:#f3f7fb}
    .setup{max-width:800px;margin:20px auto;padding:30px;background:#fff;border:1px solid #d9e4f0;border-top:7px solid #3975b8;border-radius:12px}.setup h1{margin:0 0 10px}.setup p{line-height:1.6}.setup strong{display:block;margin-top:24px}
    @media(max-width:480px){header{width:min(calc(100% - 20px),800px)}header strong{font-size:15px}header .subtitle{display:none}header a{font-size:12px;padding:0 14px}.setup{margin:12px 10px;padding:22px 18px}}
  </style>
</head>
<body>
  <header><div><strong>TISC 2026</strong><span class="subtitle">/ Onsite registration</span></div><a id="staffLink" href="#staff" aria-label="Staff dashboard">STAFF</a></header>
  <main id="mount" aria-live="polite"></main>
  <script src="config.js"></script>
  <script>
    (function(){
      var url = window.TISC_APP_URL;
      var mount = document.getElementById('mount');
      if (!url || !/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(url)) {
        mount.innerHTML = '<section class="setup"><h1>Onsite Registration</h1><p>Registration is not available yet. Please contact registration staff.</p><strong>4 October 2026 · Floor 6</strong></section>';
        return;
      }
      var frame = document.createElement('iframe');
      frame.title = 'TISC 2026 registration';
      function route(){
        var staff = location.hash === '#staff';
        frame.src = url + (staff ? '?view=staff' : '');
        document.getElementById('staffLink').href = staff ? '#' : '#staff';
        document.getElementById('staffLink').textContent = staff ? 'CHECK IN' : 'STAFF';
      }
      route();
      frame.referrerPolicy = 'no-referrer';
      mount.appendChild(frame);
      addEventListener('hashchange', route);
    })();
  </script>
</body>
</html>
