<!doctype html> 
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#102d42">
  <title>TISC 2026 | Onsite Registration</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f5f8fb;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#102d42}
    header{height:60px;display:flex;align-items:center;justify-content:center;background:#102d42;color:white;font-weight:800;letter-spacing:.08em;position:relative}
    header a{position:absolute;right:16px;color:#bfe3ee;font-size:12px;text-decoration:none}
    iframe{display:block;width:100%;height:calc(100dvh - 60px);min-height:620px;border:0;background:#f5f8fb}
    .setup{max-width:600px;margin:40px auto;padding:28px;background:white;border-radius:18px;text-align:center;box-shadow:0 8px 25px #102d4212}
    .setup h1{margin:0 0 10px}.setup p{line-height:1.6}.setup strong{display:block;margin-top:24px}
  </style>
</head>
<body>
  <header>TISC 2026 · ONSITE REGISTRATION <a id="staffLink" href="#staff" aria-label="Staff dashboard">STAFF</a></header>
  <main id="mount" aria-live="polite"></main>
  <script src="config.js"></script>
  <script>
    (function(){
      var url = window.TISC_APP_URL;
      var mount = document.getElementById('mount');
      if (!url || !/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(url)) {
        mount.innerHTML = '<section class="setup"><h1>Onsite Registration</h1><p>Registration is not available yet. Please contact registration staff.</p><strong>4 October 2026 · Floor 6</strong></section>';
        return;
      }
      var frame = document.createElement('iframe');
      frame.title = 'TISC 2026 registration';
      function route(){
        var staff = location.hash === '#staff';
        frame.src = url + (staff ? '?view=staff' : '');
        document.getElementById('staffLink').href = staff ? '#' : '#staff';
        document.getElementById('staffLink').textContent = staff ? 'CHECK IN' : 'STAFF';
      }
      route();
      frame.referrerPolicy = 'no-referrer';
      mount.appendChild(frame);
      addEventListener('hashchange', route);
    })();
  </script>
</body>
</html>
