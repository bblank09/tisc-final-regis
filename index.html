<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071333">
  <title>TISC 2026 | Onsite Registration</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#071333;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#142340}
    header{min-height:60px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px clamp(12px,3vw,28px);background:#071333;color:#fff;border-bottom:3px solid #e95b18}
    header strong{font-size:14px;letter-spacing:.06em}header a{display:inline-flex;min-height:40px;align-items:center;padding:0 14px;border:1px solid #e95b18;border-radius:9px;color:#fff;font-size:12px;font-weight:800;text-decoration:none;white-space:nowrap}header a:focus-visible{outline:3px solid #ff9a60;outline-offset:3px}header a:hover{background:#aa3909}
    iframe{display:block;width:100%;height:calc(100dvh - 63px);min-height:620px;border:0;background:#f4f5f8}
    .setup{max-width:600px;margin:40px auto;padding:28px;background:white;border-radius:18px;text-align:center;box-shadow:0 8px 25px #02091d30}.setup h1{margin:0 0 10px}.setup p{line-height:1.6}.setup strong{display:block;margin-top:24px}
    @media(max-width:480px){header strong{font-size:12px;max-width:210px}header a{font-size:11px;padding:0 10px}.setup{margin:20px 12px}}
  </style>
</head>
<body>
  <header><strong>TISC 2026 · ONSITE REGISTRATION</strong><a id="staffLink" href="#staff" aria-label="Staff dashboard">STAFF</a></header>
  <main id="mount" aria-live="polite"></main>
  <script src="config.js"></script>
  <script>
    (function(){
      var url = window.TISC_APP_URL;
      var mount = document.getElementById('mount');
      if (!url || !/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(url)) {
        mount.innerHTML = '<section class="setup"><h1>Onsite Registration</h1><p>Registration is not available yet. Please contact registration staff.</p><strong>4 October 2026 · Floor 6</strong></section>';
        return;
      }
      var frame = document.createElement('iframe');
      frame.title = 'TISC 2026 registration';
      function route(){
        var staff = location.hash === '#staff';
        frame.src = url + (staff ? '?view=staff' : '');
        document.getElementById('staffLink').href = staff ? '#' : '#staff';
        document.getElementById('staffLink').textContent = staff ? 'CHECK IN' : 'STAFF';
      }
      route();
      frame.referrerPolicy = 'no-referrer';
      mount.appendChild(frame);
      addEventListener('hashchange', route);
    })();
  </script>
</body>
</html>
